[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "evotcr"
version = "0.1.0"
description = "Versioned factors, training-only selection and frozen TCR–pMHC inference"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = ["numpy>=1.24,<2", "scipy>=1.11,<2", "scikit-learn>=1.3,<2", "pydantic>=2.8,<3", "typer>=0.16,<1", "filelock>=3.16", "threadpoolctl>=3.2"]

[project.optional-dependencies]
inference = ["torch>=2.6,<3"]
hub = ["huggingface-hub>=1.0,<2", "pyarrow>=16,<17"]
structure = ["gemmi>=0.7", "zstandard>=0.23"]
dev = ["numba>=0.57", "pytest>=8,<10", "ruff>=0.9", "build>=1.2"]

[project.scripts]
evotcr = "evotcr.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/evotcr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/evotcr/structure/_*.py" = ["E741"]


"src/evotcr/integrations/confidence.py" = ["E741"]
